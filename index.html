<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header>
      <h1>Pokemon Finder</h1>
      <p>Data from the PokeAPI. Animation by anime.js.</p>
      <div class="controls">
        <input id="searchInput" type="text" placeholder="Name or number (e.g. pikachu)">
        <button id="searchBtn">Search</button>
        <button id="randomBtn">Load 8 Random</button>
      </div>
    </header>

    <main>
      <div id="cardGrid"></div>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
